name: CI

on:
  push:
    branches: [main, develop, "fix/**", "feat/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.11"
  GOLANGCI_LINT_VERSION: "v1.64.8"
  GOVULNCHECK_VERSION: "v1.2.0"
  GITLEAKS_VERSION: "8.30.1"
  OSV_SCANNER_VERSION: "2.7.1"
  SEMGREP_VERSION: "1.186.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Lint — verifica formatação e qualidade do código Go
  # ----------------------------------------------------------------------------
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          args: --timeout=5m

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Os seguintes arquivos precisam de formatacao:"
            gofmt -l .
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # Security — vulnerabilidades em dependências Go
  # ----------------------------------------------------------------------------
  security:
    name: Security Scan (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        run: govulncheck ./...

  # ----------------------------------------------------------------------------
  # DevSecOps — Gitleaks, Semgrep SAST, OSV-Scanner, Trivy e SBOM CycloneDX
  # ----------------------------------------------------------------------------
  devsecops:
    name: DevSecOps (Secrets, SAST, SCA & SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks Secret Scan
        run: |
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose

      - name: Setup Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Semgrep SAST (Go & Secrets)
        run: |
          python3 -m pip install --no-cache-dir "semgrep==${SEMGREP_VERSION}"
          semgrep scan --config p/golang --config p/secrets --error --metrics=off --exclude fit_brother_app/build .

      - name: OSV-Scanner SCA (Go & Dart)
        run: |
          curl -sSLf "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source --lockfile=go.mod --lockfile=fit_brother_app/pubspec.lock

      - name: Generate CycloneDX SBOM (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: fit-brother-sbom-cdx
          path: sbom.cdx.json
          retention-days: 14

      - name: Trivy Vulnerability Scan (Filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # ----------------------------------------------------------------------------
  # Test — testes unitários e de integração Go + PostgreSQL (sem Redis/R2)
  # ----------------------------------------------------------------------------
  test:
    name: Test (Go + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitbrother
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: fitbrother_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: go test -v -race -count=1 ./internal/...

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://fitbrother:secret@localhost:5432/fitbrother_test?sslmode=disable
          APP_ENV: test
          STORAGE_DRIVER: local
          STORAGE_LOCAL_DIR: /tmp/fitbrother-test-storage
        run: |
          export AES_KEY="$(openssl rand -base64 32)"
          export CPF_HMAC_SECRET="$(openssl rand -base64 32)"
          export PASSWORD_PEPPER="$(openssl rand -base64 32)"
          go test -v -race -count=1 -timeout 3m -tags integration ./tests/integration/...

      - name: Coverage report
        run: |
          go test -coverprofile=coverage.out ./internal/...
          go tool cover -func=coverage.out

  # ----------------------------------------------------------------------------
  # Flutter — análise estática, testes e build web
  # ----------------------------------------------------------------------------
  flutter:
    name: Flutter (Analyze, Test & Web Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fit_brother_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build Web
        run: flutter build web --release

  # ----------------------------------------------------------------------------
  # Build — valida que o binário Go e a imagem Docker compilam corretamente
  # ----------------------------------------------------------------------------
  build:
    name: Build (Go & Docker)
    runs-on: ubuntu-latest
    needs: [lint, security, devsecops, test, flutter]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o /tmp/server ./cmd/api

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t fit-brother:${{ github.sha }} .

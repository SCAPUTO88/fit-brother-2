name: CI

on:
  push:
    branches: [main, develop, "fix/**", "feat/**"]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.26.11"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Lint — verifica formatação e qualidade do código Go
  # ----------------------------------------------------------------------------
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Os seguintes arquivos precisam de formatacao:"
            gofmt -l .
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # Security — vulnerabilidades em dependências Go
  # ----------------------------------------------------------------------------
  security:
    name: Security Scan (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ----------------------------------------------------------------------------
  # Test — testes unitários e de integração Go + PostgreSQL + Redis
  # ----------------------------------------------------------------------------
  test:
    name: Test (Go + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitbrother
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: fitbrother_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: go test -v -race -count=1 ./internal/...

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://fitbrother:secret@localhost:5432/fitbrother_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          APP_ENV: test
          AES_KEY: dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleTA=
          CPF_HMAC_SECRET: test-hmac-secret-for-ci-only-32chars!
          PASSWORD_PEPPER: test-pepper-for-ci-only-32chars!!
          R2_ACCOUNT_ID: test
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET: test
          R2_PUBLIC_URL: http://localhost
        run: go test -v -race -count=1 -timeout 3m -tags integration ./tests/integration/...

      - name: Coverage report
        run: |
          go test -coverprofile=coverage.out ./internal/...
          go tool cover -func=coverage.out

  # ----------------------------------------------------------------------------
  # Flutter — análise estática, testes e build web
  # ----------------------------------------------------------------------------
  flutter:
    name: Flutter (Analyze, Test & Web Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fit_brother_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build Web
        run: flutter build web --release

  # ----------------------------------------------------------------------------
  # Build — valida que o binário Go e a imagem Docker compilam corretamente
  # ----------------------------------------------------------------------------
  build:
    name: Build (Go & Docker)
    runs-on: ubuntu-latest
    needs: [lint, test, flutter]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o /tmp/server ./cmd/api

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t fit-brother:${{ github.sha }} .

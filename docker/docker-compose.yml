# ==============================================================================
# docker-compose.yml — Ambiente de Desenvolvimento Local
# Este arquivo NÃO é usado em produção.
# Stack alvo fora do GCP (ADR-007): PaaS Container + Supabase Postgres + R2
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # API Backend Go
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fitbrother_api
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      APP_BASE_URL: http://localhost:8080
      # Banco local (docker)
      DATABASE_URL: postgres://fitbrother:secret@postgres:5432/fitbrother_db?sslmode=disable
      # Storage local de mídia em desenvolvimento (ADR-005)
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /tmp/fitbrother-storage
      # Segredos — definidos no .env local
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_REFRESH_TOKEN_TTL: 168h
      VIDEO_SIGNED_URL_TTL_MINUTES: "5"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
    secrets:
      - jwt_private_key
      - jwt_public_key
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Hot-reload em desenvolvimento (com air)
      - ..:/app
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # PostgreSQL — réplica local do Supabase para desenvolvimento offline
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fitbrother_postgres
    environment:
      POSTGRES_USER: fitbrother
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fitbrother_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitbrother -d fitbrother_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Adminer — UI para inspecionar o banco em desenvolvimento
  # Acesse: http://localhost:8081
  # ----------------------------------------------------------------------------
  adminer:
    image: adminer:4.8.1
    container_name: fitbrother_adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:

secrets:
  jwt_private_key:
    file: ../secrets/jwt_rsa.pem
  jwt_public_key:
    file: ../secrets/jwt_rsa.pub.pem
